[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[project]
name = "all3dscan"
description = "All3DScan desktop app: C++ sensor layer, Rust processing engine, PyQt6 GUI"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
]
dependencies = [
    # OpenCASCADE, for the STEP export (rea_engine.py): a pip wheel of what
    # pythonocc-core wraps, which is only packaged for conda. 8.0 moved the
    # collections rea_engine.py uses into OCP.collections.
    "cadquery-ocp>=8.0",
    # Any numpy 2; 2.5 and later need Python 3.12.
    "numpy>=2",
    "PyOpenGL>=3.1.10",
    "PyQt6>=6.11",
]
# Taken from engine_rust/Cargo.toml.
dynamic = ["version"]

# Type hints come from all3dscan_engine.pyi, which maturin only finds next to
# this file.
[tool.maturin]
manifest-path = "engine_rust/Cargo.toml"
module-name = "all3dscan_engine"
# engine_rust/build.rs compiles ../hw_cpp, which lies outside the crate.
include = [{ path = "hw_cpp/**/*", format = "sdist" }]

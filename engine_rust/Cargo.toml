# A workspace of its own, not a member of the root one that holds rust_core,
# so the engine's dependencies and settings never reach the CMake app's build.
#
# Run maturin from the repository root, where pyproject.toml is. Run from this
# directory, maturin ignores that file and installs a second, conflicting
# package.
[workspace]

[package]
name = "all3dscan_engine"
version = "0.1.0"
edition = "2024"
description = "All3DScan processing engine: C++ sensor bridge (cxx) and Python module (PyO3)"
license = "MIT"
repository = "https://github.com/BR1ZB3AR/All3DScan"
publish = false

[lib]
name = "all3dscan_engine"
# cdylib is the Python extension module; rlib lets cargo test link the crate.
crate-type = ["cdylib", "rlib"]

[dependencies]
cxx = "1.0.205"
nalgebra = "0.35"
numpy = "0.30"
pyo3 = "0.30.1"
rayon = "1.12"

[build-dependencies]
cc = "1"
cxx-build = "1.0.205"
pkg-config = "0.3"

[profile.release]
lto = "thin"
codegen-units = 1
# Leave panic as "unwind": PyO3 can only turn a Rust panic into a Python
# exception if it unwinds, and "abort" would close the whole GUI.

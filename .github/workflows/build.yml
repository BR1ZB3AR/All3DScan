name: Build and test

on:
  push:
  pull_request:

jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake qtbase5-dev libusb-1.0-0-dev \
            catch2 nlohmann-json3-dev python3
      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON -DBUILD_TESTS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

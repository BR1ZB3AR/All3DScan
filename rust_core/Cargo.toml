[package]
name = "all3dscan_rust"
version = "0.1.0"
edition = "2021"
authors = ["All3DScan Contributors"]
description = "Safe high-performance Rust core library for All3DScan"

[lib]
name = "all3dscan_rust"
# Static library only: cargo skips LTO for a crate that is also built as an
# rlib, which left the workspace's lto = true without effect.
crate-type = ["staticlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
byteorder = "1.5"
anyhow = "1.0"

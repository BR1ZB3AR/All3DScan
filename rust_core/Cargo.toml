[package]
name = "all3dscan_rust"
version = "0.1.0"
edition = "2021"
authors = ["All3DScan Contributors"]
description = "Safe high-performance Rust core library for All3DScan"

[lib]
name = "all3dscan_rust"
crate-type = ["staticlib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
byteorder = "1.5"
anyhow = "1.0"

[profile.release]
opt-level = 3
lto = true
